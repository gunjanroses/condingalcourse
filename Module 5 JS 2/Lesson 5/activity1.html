<!DOCTYPE html>
<html>
<head>
  <title>My Delivery Tracker</title>

<link
rel="stylesheet"
href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
/>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: aliceblue;
      text-align: center;
      padding: 30px;
    }
    h1 { color: #ff5a43; }
    button {
      background: #ff5a43;
      color: white;
      padding: 10px 25px;
      border: none;
      border-radius: 20px;
      cursor: pointer;
      margin: 5px;
    }
    div {
      border: 1px solid #ff5a43;
      width: 280px;
      margin: 6px auto;
      padding: 8px 12px;
      text-align: left;
      border-radius: 6px;
    }
  </style>
</head>
<body>

  <h1>My Delivery Tracker</h1>
  <button onclick="saveOrder()">Save Order</button>
  <button onclick="startDelivery()">Start Delivery</button>

  <div>JSON Text: <span id="json-text"></span></div>
  <div>Loaded Item: <span id="loaded-item"></span></div>
  <div>Loaded Price: <span id="loaded-price"></span></div>
  <div>Status: <span id="status"></span></div>
  <div>Result: <span id="result"></span></div>

  <script>
    let order = {
        item: "Pizza" , 
        price: 459,
        shop: "Pizza Hut"
    };
    function saveOrder() {
         console.log(order);
         let jsonText = JSON.stringify(order); // THIS CONVERTS FROM - OBJECT TO STRING//
         document.getElementById("json-text").innerHTML = jsonText;

         let loadedOrder = JSON.parse(jsonText); // THIS CONVERTS FROM - STRING TO OBJECT//
         document.getElementById("loaded-item").innerHTML = loadedOrder.item;
         document.getElementById("loaded-price").innerHTML = loadedOrder.price;
    }
    //THIS FUNCTION WILL LET THE CODE WAIT FOR FEW MILLISECONDS//
    function delay(ms) {
        return new Promise(function (resolve) {
            setTimeout(resolve , ms);
        })
    }

     async function startDelivery() {
     document.getElementById("result").innerHTML = "<div class='spinner-border'></div>";
     document.getElementById("status").innerHTML = "🍜 Order Received";
      await delay(2000);
     document.getElementById("status").innerHTML = "⏲️ Kitchen is preparing your order."
     
      await delay(4000);
     document.getElementById("status").innerHTML = "🛵 Out for delivery";

      await delay(4000);
     document.getElementById("status").innerHTML = "🍕 Your pizza has arrived.";
     document.getElementById("result").innerHTML = "✅";
    }
    
    
  </script>
</body>
</html>
